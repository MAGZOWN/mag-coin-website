<script>
const slot = document.getElementById('scanSlot');
const input = document.getElementById('addrInput');
const btn = document.getElementById('scanBtn');
const report = document.getElementById('report');
const errMsg = document.getElementById('errMsg');

const FLOKIFI_FACTORY = '0xb8d8701589ce9cecbcedc8dbdadff30e987ee0e8';
const BASESCAN_API_KEY = 'GXQ75KPFSKG4MI3355J42T4487X5W59GG3';

function isValidAddress(a){ return /^0x[a-fA-F0-9]{40}$/.test(a.trim()); }

function pct(x){ return (parseFloat(x) * 100).toFixed(1) + '%'; }

function setPill(id, state, text){
  const el = document.getElementById(id);
  el.className = 'pill ' + state;
  el.textContent = text;
}

// Ask BaseScan (via Etherscan's unified API) who deployed each address.
// Returns a map of lowercase address -> lowercase creator address.
async function getContractCreators(addresses){
  const result = {};
  for(let i = 0; i < addresses.length; i += 5){
    const batch = addresses.slice(i, i + 5);
    const url = `https://api.etherscan.io/v2/api?chainid=8453&module=contract&action=getcontractcreation&contractaddresses=${batch.join(',')}&apikey=${BASESCAN_API_KEY}`;
    try{
      const res = await fetch(url);
      if(!res.ok) continue;
      const data = await res.json();
      if(data.status === '1' && Array.isArray(data.result)){
        data.result.forEach(r => {
          if(r.contractAddress && r.contractCreator){
            result[r.contractAddress.toLowerCase()] = r.contractCreator.toLowerCase();
          }
        });
      }
    }catch(e){
      // Skip this batch on failure; GoPlus's own result still stands for these holders.
    }
  }
  return result;
}

async function scan(){
  const address = input.value.trim();
  errMsg.classList.remove('show');
  report.classList.remove('show');

  if(!isValidAddress(address)){
    errMsg.textContent = 'That doesn\'t look like a valid Base contract address (should start with 0x and be 42 characters).';
    errMsg.classList.add('show');
    return;
  }

  slot.classList.add('scanning');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"><span></span><span></span><span></span></span>';

  try{
    const res = await fetch(`https://api.gopluslabs.io/api/v1/token_security/8453?contract_addresses=${address}`);
    if(!res.ok) throw new Error('Network error');
    const data = await res.json();
    const info = data.result && data.result[address.toLowerCase()];

    if(!info){
      errMsg.textContent = 'No security data found for this address on Base. It may be a new, unindexed, or non-token contract.';
      errMsg.classList.add('show');
      return;
    }

    await renderReport(address, info);
  }catch(e){
    errMsg.textContent = 'Could not complete the scan right now. The data source may be temporarily unavailable — try again in a moment.';
    errMsg.classList.add('show');
  }finally{
    slot.classList.remove('scanning');
    btn.disabled = false;
    btn.textContent = 'Scan token';
  }
}

async function renderReport(address, info){
  document.getElementById('tName').textContent = (info.token_name || 'Unknown token') + (info.token_symbol ? ' (' + info.token_symbol + ')' : '');
  document.getElementById('tAddr').textContent = address;

  let riskPoints = 0;

  // Verified
  const verified = info.is_open_source === '1';
  setPill('pillVerified', verified ? 'ok' : 'bad', verified ? 'Yes' : 'No');
  document.getElementById('valVerified').textContent = verified ? 'Source code verified' : 'Not verified';
  document.getElementById('noteVerified').textContent = verified ? 'Anyone can audit the exact code deployed.' : 'Unverified contracts can hide arbitrary behavior. Treat with caution.';
  if(!verified) riskPoints += 2;

  // Honeypot
  const honeypot = info.is_honeypot === '1';
  setPill('pillHoneypot', honeypot ? 'bad' : 'ok', honeypot ? 'Danger' : 'Clear');
  document.getElementById('valHoneypot').textContent = honeypot ? 'Cannot be sold' : 'Sells normally';
  document.getElementById('noteHoneypot').textContent = honeypot ? 'This token shows signs of a honeypot — buyers may be unable to sell.' : 'No honeypot pattern detected in this check.';
  if(honeypot) riskPoints += 5;

  // Tax
  const buyTax = info.buy_tax ? parseFloat(info.buy_tax) : 0;
  const sellTax = info.sell_tax ? parseFloat(info.sell_tax) : 0;
  const maxTax = Math.max(buyTax, sellTax);
  setPill('pillTax', maxTax > 0.15 ? 'bad' : maxTax > 0.05 ? 'warn' : 'ok', maxTax > 0.15 ? 'High' : maxTax > 0.05 ? 'Moderate' : 'Low');
  document.getElementById('valTax').textContent = `Buy ${pct(buyTax)} · Sell ${pct(sellTax)}`;
  if(maxTax > 0.15) riskPoints += 2; else if(maxTax > 0.05) riskPoints += 1;

  // Holder concentration
  let topHolderPct = 0;
  if(info.holders && info.holders.length){
    const sorted = [...info.holders].sort((a,b) => parseFloat(b.percent) - parseFloat(a.percent));
    const top = sorted.find(h => !h.is_contract || h.tag) || sorted[0];
    topHolderPct = parseFloat(top.percent);
  }
  setPill('pillHolder', topHolderPct > 0.3 ? 'bad' : topHolderPct > 0.15 ? 'warn' : 'ok', topHolderPct > 0.3 ? 'High' : topHolderPct > 0.15 ? 'Watch' : 'Healthy');
  document.getElementById('valHolder').textContent = topHolderPct ? pct(topHolderPct) + ' held by top wallet' : 'No holder data';
  document.getElementById('noteHolder').textContent = topHolderPct > 0.3 ? 'A single wallet controls a large share of supply — price can be highly sensitive to their actions.' : 'Ownership looks reasonably distributed based on available data.';
  if(topHolderPct > 0.3) riskPoints += 2; else if(topHolderPct > 0.15) riskPoints += 1;

  // LP lock (GoPlus + Flokifi fallback check)
  let lpLockedPct = 0;
  let flokifiDetected = false;
  const hasLpData = info.lp_holders && info.lp_holders.length > 0;

  if(hasLpData){
    lpLockedPct = info.lp_holders.reduce((sum,h) => sum + (h.is_locked === 1 || h.is_locked === '1' ? parseFloat(h.percent) : 0), 0);

    const unlockedHolders = info.lp_holders.filter(h => !(h.is_locked === 1 || h.is_locked === '1') && h.address);
    if(unlockedHolders.length){
      const creators = await getContractCreators(unlockedHolders.map(h => h.address));
      unlockedHolders.forEach(h => {
        const creator = creators[h.address.toLowerCase()];
        if(creator === FLOKIFI_FACTORY){
          lpLockedPct += parseFloat(h.percent);
          flokifiDetected = true;
        }
      });
    }
  }

  setPill('pillLp', !hasLpData ? 'warn' : lpLockedPct > 0.5 ? 'ok' : lpLockedPct > 0 ? 'warn' : 'bad',
    !hasLpData ? 'Unknown' : lpLockedPct > 0.5 ? 'Locked' : lpLockedPct > 0 ? 'Partial' : 'Unlocked');
  document.getElementById('valLp').textContent = hasLpData ? pct(lpLockedPct) + ' of liquidity locked' : 'No liquidity pool data found';
  document.getElementById('noteLp').textContent = hasLpData
    ? (lpLockedPct > 0.5 ? 'Most liquidity is locked, reducing rug-pull risk from the pool itself.' : 'Liquidity is only partially locked or unlocked — the pool could be withdrawn.') + (flokifiDetected ? ' (Includes a lock verified on FlokiFi Locker.)' : '')
    : 'Could not detect a tracked liquidity pool for this token.';
  if(hasLpData && lpLockedPct < 0.5) riskPoints += 2;

  // Overall verdict
  const verdict = document.getElementById('verdict');
  if(riskPoints >= 5){
    verdict.className = 'verdict danger'; verdict.textContent = 'High risk';
  } else if(riskPoints >= 2){
    verdict.className = 'verdict warn'; verdict.textContent = 'Use caution';
  } else {
    verdict.className = 'verdict safe'; verdict.textContent = 'Low risk signals';
  }

  report.classList.add('show');
}

btn.addEventListener('click', scan);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') scan(); });

// mobile nav toggle
const navToggleBtn = document.getElementById('navToggleBtn');
const siteNav = document.getElementById('siteNav');
navToggleBtn.addEventListener('click', () => {
  const isOpen = siteNav.classList.toggle('open');
  navToggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  navToggleBtn.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
});
</script>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">MAG COIN Official Vector Logo</title>
  <desc id="desc">True vector black and gold MAG COIN token icon for BaseScan.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="72%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="22%" stop-color="#f6c84b"/>
      <stop offset="55%" stop-color="#b77a10"/>
      <stop offset="78%" stop-color="#f8d56a"/>
      <stop offset="100%" stop-color="#8a5b08"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.45" stdDeviation="0.35" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Coin body -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)"/>
  <circle cx="16" cy="16" r="15.1" fill="none" stroke="url(#gold)" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="13.7" fill="none" stroke="#d7a52b" stroke-width="0.35"/>
  <circle cx="16" cy="16" r="12.8" fill="none" stroke="#6e4c0c" stroke-width="0.25"/>

  <!-- Circuit-style decorative lines -->
  <g fill="none" stroke="#b98719" stroke-width="0.23" opacity="0.9">
    <path d="M5.2 11.2 H9.1 L10.4 9.9"/>
    <path d="M5.2 13.0 H8.4 L9.8 11.6"/>
    <path d="M26.8 11.2 H22.9 L21.6 9.9"/>
    <path d="M26.8 13.0 H23.6 L22.2 11.6"/>
    <path d="M5.2 20.8 H9.1 L10.4 22.1"/>
    <path d="M26.8 20.8 H22.9 L21.6 22.1"/>
  </g>
  <g fill="#d6a52b">
    <circle cx="5.2" cy="11.2" r="0.35"/><circle cx="5.2" cy="13.0" r="0.35"/>
    <circle cx="26.8" cy="11.2" r="0.35"/><circle cx="26.8" cy="13.0" r="0.35"/>
    <circle cx="5.2" cy="20.8" r="0.35"/><circle cx="26.8" cy="20.8" r="0.35"/>
  </g>

  <!-- Stylized M monogram -->
  <path d="M10.1 10.0 L10.1 5.8 L12.2 5.8 L16 9.0 L19.8 5.8 L21.9 5.8 L21.9 10.0
           L19.9 10.0 L19.9 8.2 L16 11.5 L12.1 8.2 L12.1 10.0 Z"
        fill="url(#gold)" filter="url(#softShadow)"/>
  <path d="M12.5 8.3 L16 11.1 L19.5 8.3 L19.5 9.7 L16 12.6 L12.5 9.7 Z"
        fill="#f6c84b"/>

